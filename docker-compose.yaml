version: "3"
networks:
  expense:
volumes:
  mysql:  # docker volume create mysql
services:
  mysql:
    image: srinivasdevops97/mysql:v1
    container_name: mysql  # --name mysql
    volumes:
      - mysql:/var/lib/mysql    # -v mysql:/var/lib/mysql
  backend:
    image: srinivasdevops97/backend:v1
    container_name: backend  # --name backend
    command: sh -c "sleep 15 && node /opt/server/index.js"
    depends_on:
    - mysql
  frontend:
    image: srinivasdevops97/frontend:v1
    container_name: frontend  # --name frontend
    ports:
    - 80:80
    depends_on:
    - backend